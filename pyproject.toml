[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espeak-ng-polish"
version = "0.1.0"
description = "Measure and improve Polish text-to-phoneme rules of espeak-ng (as used by Piper)"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["piper-tts==1.8.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
espeak-pl = "espeak_pl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
